<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lexical Diversity Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Lexical Diversity Explorer</h1>
  <p>Analyze the lexical diversity (vocabulary richness) of public domain books from Project Gutenberg. Search for a title or author, choose a book, and build the graph.</p>

  <div>
    <label for="searchBox">Search Project Gutenberg Books:</label>
    <input type="text" id="searchBox" placeholder="Enter book title or author...">
    <button id="searchBtn">Search</button>
    <br><br>
    <label for="resultsDropdown">Select a book:</label>
    <select id="resultsDropdown" style="display: none;"></select>
    <button id="buildGraphBtn" style="display: none;">Build Graph</button>
  </div>

  <br>

  <svg id="ttrPlot" width="800" height="400"></svg>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
