<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lexical Diversity Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Lexical Diversity Explorer</h1>

  <div>
    <label for="searchBox">Search Project Gutenberg Books:</label>
    <input type="text" id="searchBox" placeholder="Enter book title or keyword...">
    <button id="searchBtn">Search</button>
    <ul id="resultsList"></ul>
  </div>

  <div>
    <label for="bookId">Selected Book ID:</label>
    <input type="number" id="bookId" placeholder="Click a result or enter manually">
  </div>

  <div id="bookMeta" style="margin-bottom: 1em;"></div>

  <div>
    <label for="mode">TTR Mode:</label>
    <select id="mode">
      <option value="cumulative">Cumulative</option>
      <option value="rolling">Rolling</option>
    </select>
  </div>

  <div id="rollingParams" style="display: none;">
    <label id="windowLabel" for="windowSize">Window Size:</label>
    <input type="number" id="windowSize" value="200" min="10" max="1000">

    <label id="stepLabel" for="step">Step:</label>
    <input type="number" id="step" value="50" min="1" max="1000">
  </div>

  <button id="analyzeBtn" onclick="fetchTTR()">Build Graph</button>
  <span id="loading" style="display: none;">⏳ Loading...</span>

  <svg id="ttrPlot" width="800" height="400"></svg>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
