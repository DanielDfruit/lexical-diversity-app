<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lexical Diversity Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Lexical Diversity Explorer</h1>

  <div>
    <label for="searchBox">Search Project Gutenberg Books:</label>
    <input type="text" id="searchBox" placeholder="Enter book title or keyword...">
    <ul id="resultsList"></ul>
  </div>

  <div>
    <label for="bookId">Or enter Book ID manually:</label>
    <input type="number" id="bookId" value="1342">
    <button onclick="fetchTTR()">Analyze</button>
  </div>

  <svg id="ttrPlot" width="800" height="400"></svg>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
