<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lexical Diversity Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Lexical Diversity Explorer</h1>

  <div>
    <label for="searchBox">Search Project Gutenberg Books:</label>
    <input type="text" id="searchBox" placeholder="Enter book title or keyword...">
    <button onclick="searchBooks()">Search</button>
    <ul id="resultsList"></ul>
  </div>

  <div>
    <label for="bookId">Selected Book ID:</label>
    <input type="number" id="bookId">
  </div>

  <div>
    <label for="modeSelect">TTR Mode:</label>
    <select id="modeSelect" onchange="updateModeVisibility()">
      <option value="cumulative">Cumulative</option>
      <option value="rolling">Rolling</option>
    </select>
  </div>

  <div id="rollingParams" style="display:none;">
    <label for="windowSize">Window Size:</label>
    <input type="number" id="windowSize" value="200" min="10" max="1000">
    <label for="stepSize">Step:</label>
    <input type="number" id="stepSize" value="50" min="1" max="1000">
  </div>

  <button onclick="fetchTTR()">Build Graph</button>

  <svg id="ttrPlot" width="800" height="400"></svg>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
